<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Promptorium · Tarefas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1014}
a{color:#F2A541}a:hover{color:#FFC872}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 100%; height: 100vh; min-height: 600px; overflow: hidden; display: flex; flex-direction: column; background: #0E1014; color: #E7E9EE; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; line-height: 1.45">

<header style="min-height: 44px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 6px 12px; background: #14171D; border-bottom: 1px solid #252B35; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 8px">
<div style="width: 26px; height: 26px; border-radius: 6px; background: #F2A541; color: #1A1206; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"></path></svg>
</div>
<span style="font-weight: 600; font-size: 14px">Promptorium</span>
</div>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; background: #1A1E26; border: 1px solid #252B35; border-radius: 6px; color: #E7E9EE; font-size: 12px; cursor: pointer">
<span style="color: #A0A8B6">Workspace</span><span style="font-weight: 500">promptorium</span><span style="font-family: 'JetBrains Mono', monospace; color: #A0A8B6">main</span>
</button>
<button type="button" style="flex: 1 1 260px; max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; background: #0E1014; border: 1px solid #252B35; border-radius: 6px; color: #A0A8B6; font-size: 12px; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="flex: 1; text-align: left">Buscar ou executar comando…</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 1px 6px; border: 1px solid #252B35; border-radius: 4px">Ctrl K</span>
</button>
<button type="button" style="height: 30px; padding: 0 12px; background: #F2A541; border: none; border-radius: 6px; color: #1A1206; font-weight: 600; font-size: 12px; cursor: pointer">Nova tarefa</button>
</header>

<div style="flex: 1; display: flex; flex-wrap: wrap; min-height: 0; overflow: hidden">

<nav aria-label="Navegação principal" style="flex: 0 0 56px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; background: #14171D; border-right: 1px solid #252B35">
<a href="Main.dc.html" aria-label="Sessões" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #A0A8B6">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 9l3 3-3 3M12 15h5"></path></svg>
</a>
<a href="Prompt.dc.html" aria-label="Prompt" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #A0A8B6">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.4 7.6L3.5 21l1.4-4.6A8.5 8.5 0 1 1 21 12z"></path><path d="M12 8l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1z"></path></svg>
</a>
<a href="Specs.dc.html" aria-label="Specs" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #A0A8B6">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>
</a>
<a href="Tarefas.dc.html" aria-label="Tarefas" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #2A2418; color: #F2A541">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"></rect><rect x="10" y="4" width="5" height="10" rx="1"></rect><rect x="17" y="4" width="4" height="13" rx="1"></rect></svg>
</a>
<a href="Agentes.dc.html" aria-label="Agentes" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #A0A8B6">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M12 4v4M9 13v1M15 13v1M9 17h6"></path></svg>
</a>
<a href="Review.dc.html" aria-label="Review" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #A0A8B6">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"></circle><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="12" r="2"></circle><path d="M6 7v10M16 12h-3a5 5 0 0 1-5-5"></path></svg>
</a>
<a href="Codigo.dc.html" aria-label="Código" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #A0A8B6">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"></path></svg>
</a>
<a href="MCP.dc.html" aria-label="Servidores MCP" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #A0A8B6">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3v5M15 3v5M7 8h10v3a5 5 0 0 1-10 0zM12 16v5"></path></svg>
</a>
<div style="flex: 1"></div>
<button type="button" aria-label="Configurações" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: none; border: none; color: #A0A8B6; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
</button>
</nav>

<main style="min-height: 0; flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 14px 20px; border-bottom: 1px solid #252B35">
<h1 style="margin: 0; font-size: 16px; font-weight: 600; flex: 1 1 200px">Tarefas</h1>
<button type="button" style="height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid #252B35; background: #14171D; color: #E7E9EE; font-size: 12px; cursor: pointer">Spec: todas</button>
<button type="button" style="height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid #252B35; background: #14171D; color: #E7E9EE; font-size: 12px; cursor: pointer">Agente: todos</button>
<button type="button" style="height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid #252B35; background: #14171D; color: #E7E9EE; font-size: 12px; cursor: pointer">Ver grafo de dependências</button>
</div>

<div style="flex: 1; min-height: 0; overflow: auto">
<div style="display: grid; grid-template-columns: repeat(4, minmax(260px, 1fr)); gap: 14px; padding: 16px 20px; min-width: 1100px">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="4">
<section style="display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 10px; background: #14171D; border: 1px solid #252B35">
<div style="display: flex; align-items: center; gap: 8px; padding: 2px 4px 6px">
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.color}}"></span>
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #A0A8B6">{{c.name}}</h2>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A0A8B6">{{c.count}}</span>
</div>
<sc-for list="{{c.cards}}" as="t" hint-placeholder-count="3">
<article style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 8px; background: #1A1E26; border: 1px solid {{t.border}}">
<div style="display: flex; gap: 8px; font-size: 11px"><span style="font-family: 'JetBrains Mono', monospace; color: #A0A8B6">{{t.id}}</span><span style="flex: 1"></span><span style="padding: 0 6px; border-radius: 4px; background: #252B35; color: #A0A8B6">{{t.spec}}</span></div>
<div style="font-weight: 500">{{t.title}}</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #A0A8B6">
<span style="width: 18px; height: 18px; border-radius: 50%; background: #252B35; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #E7E9EE">{{t.initial}}</span>
<span>{{t.agent}}</span><span style="flex: 1"></span><span style="color: {{t.metaColor}}">{{t.meta}}</span>
</div>
<sc-if value="{{t.live}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 4px; background: #11201D; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #4FD1B5"><span style="width: 6px; height: 6px; border-radius: 50%; background: #4FD1B5"></span>{{t.live}}</div>
</sc-if>
<sc-if value="{{t.runnable}}" hint-placeholder-val="{{false}}">
<button type="button" style="height: 28px; border-radius: 6px; border: 1px solid #5C4520; background: #241E12; color: #F2A541; font-size: 12px; cursor: pointer">Executar com agente</button>
</sc-if>
</article>
</sc-for>
</section>
</sc-for>
</div>
</div>
</main>
</div>
<footer style="flex: none; min-height: 28px; display: flex; align-items: center; flex-wrap: wrap; gap: 16px; padding: 0 12px; background: #14171D; border-top: 1px solid #252B35; font-size: 11px; color: #A0A8B6">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #4FD1B5"></span>Claude Code CLI conectado</span>
<span style="width: 1px; height: 14px; background: #252B35"></span>
<span style="display: flex; align-items: center; gap: 6px"><span>Sessões</span><span style="font-family: 'JetBrains Mono', monospace; color: #E7E9EE">3/6</span><span style="color: #F2A541">· 2 aguardando</span></span>
<span style="display: flex; align-items: center; gap: 6px"><span>Subagentes</span><span style="font-family: 'JetBrains Mono', monospace; color: #E7E9EE">2 rodando</span></span>
<span style="display: flex; align-items: center; gap: 6px"><span>MCP</span><span style="font-family: 'JetBrains Mono', monospace; color: #E7E9EE">3/4</span><span style="color: #F27A6E">· 1 falhou</span></span>
<span style="flex: 1"></span>
<span style="display: flex; align-items: center; gap: 6px"><span>Tokens hoje</span><span style="font-family: 'JetBrains Mono', monospace; color: #E7E9EE">512k</span><span style="font-family: 'JetBrains Mono', monospace">↑380k ↓132k · cache 1.2M</span></span>
<span style="width: 1px; height: 14px; background: #252B35"></span>
<span style="display: flex; align-items: center; gap: 6px"><span>Uso 5h</span><span role="img" aria-label="42% do limite de 5 horas" style="width: 60px; height: 6px; border-radius: 3px; background: #252B35; overflow: hidden; display: flex"><span style="width: 42%; background: #4FD1B5"></span></span><span style="font-family: 'JetBrains Mono', monospace; color: #E7E9EE">42%</span><span>· reinicia em 2h13</span></span>
<span style="display: flex; align-items: center; gap: 6px"><span>Semana</span><span role="img" aria-label="18% do limite semanal" style="width: 60px; height: 6px; border-radius: 3px; background: #252B35; overflow: hidden; display: flex"><span style="width: 18%; background: #8EA4C8"></span></span><span style="font-family: 'JetBrains Mono', monospace; color: #E7E9EE">18%</span></span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const card = (id, spec, title, agent, meta, extra) => ({ id, spec, title, agent, initial: agent[0].toUpperCase(), meta, metaColor: '#A0A8B6', border: '#252B35', live: '', runnable: false, ...extra });
    const cols = [
      { name: 'Backlog', color: '#7C8595', cards: [
        card('TASK-022', 'SPEC-002', 'Persistir eventos com drift', 'implementer', 'bloqueada por 021', { metaColor: '#F27A6E' }),
        card('TASK-024', 'SPEC-002', 'Fila de aprovações na UI', 'implementer', 'pronta', { runnable: true }),
        card('TASK-030', 'SPEC-003', 'Formulário do editor de agentes', 'implementer', 'pronta', { runnable: true }),
        card('TASK-031', 'SPEC-003', 'Gerar .claude/agents/*.md', 'implementer', 'bloqueada por 030', { metaColor: '#F27A6E' })
      ] },
      { name: 'Em execução', color: '#4FD1B5', cards: [
        card('TASK-012', 'SPEC-001', 'Shell da IDE', 'implementer', '12m · $0.62', { border: '#2F6B5E', live: 'Bash · flutter test' }),
        card('TASK-021', 'SPEC-002', 'ClaudeProcess: parser stream-json', 'implementer', 'aguardando você', { border: '#5C4520', metaColor: '#F2A541' }),
        card('TASK-025', 'SPEC-002', 'Testes do GitService', 'tester', 'aguardando você', { border: '#5C4520', metaColor: '#F2A541' })
      ] },
      { name: 'Review', color: '#F2A541', cards: [
        card('TASK-011', 'SPEC-001', 'Barra de status', 'implementer', '4 arquivos · +126 −18'),
        card('TASK-013', 'SPEC-001', 'Tema escuro e tokens', 'reviewer', '2 comentários')
      ] },
      { name: 'Feito', color: '#8EA4C8', cards: [
        card('TASK-010', 'SPEC-001', 'Esqueleto do app Flutter', 'implementer', 'merge a91c'),
        card('TASK-020', 'SPEC-002', 'GitService: worktrees', 'implementer', 'merge 3be0'),
        card('TASK-014', 'SPEC-001', 'Schema drift inicial', 'implementer', 'merge 77d2')
      ] }
    ].map((c) => ({ ...c, count: String(c.cards.length) }));
    return { cols };
  }
}
</script>
</body>
</html>
