<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Colunas na sprint ativa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #0E1014; color: #E7E9EE; font-family: 'IBM Plex Sans', sans-serif; overflow: hidden">
  <dc-import name="Lateral" hint-size="56px,900px"></dc-import>
  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="Topo" sprint="{{sprint}}" prog="{{prog}}" vista="colunas" aviso="{{aviso}}" hint-size="1384px,96px"></dc-import>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 16px 24px 24px">
      <sc-for list="{{colunas}}" as="c" hint-placeholder-count="4">
        <div style="background: #14171D; border: 1px solid #252B35; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #A0A8B6; padding: 2px 4px"><span>{{c.nome}}</span><span>{{c.n}}</span></div>
          <sc-for list="{{c.cards}}" as="s" hint-placeholder-count="2">
            <div style="background: #1A1E26; border: 1px solid #252B35; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; justify-content: space-between; font-size: 12px; color: #A0A8B6"><span style="font-family: 'JetBrains Mono', monospace">{{s.code}}</span><span>{{s.etapas}}</span></div>
              <span style="font-size: 14px; line-height: 20px; font-weight: 600">{{s.title}}</span>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sprint":{"editor":null,"default":"Sprint 3"},"prog":{"editor":null,"default":"5 de 8"},"aviso":{"editor":null,"default":true},"movida":{"editor":null,"default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      sprint: this.props.sprint ?? 'Sprint 3',
      prog: this.props.prog ?? '5 de 8',
      aviso: this.props.aviso ?? true,
      colunas: [
        this.props.movida
          ? { nome: 'Backlog', n: 0, cards: [] }
          : { nome: 'Backlog', n: 1, cards: [{ code: 'SPEC-043', title: 'Ações rápidas na bandeja', etapas: '0/5' }] },
        { nome: 'Em execução', n: 1, cards: [{ code: 'SPEC-042', title: 'Sprints no Quadro', etapas: '4/13' }] },
        { nome: 'Review', n: 1, cards: [{ code: 'SPEC-040', title: 'Ditado por voz', etapas: '10/10' }] },
        { nome: 'Feito', n: 5, cards: [
          { code: 'SPEC-041', title: 'Radar na bandeja', etapas: '9/9' },
          { code: 'SPEC-039', title: 'Nova spec com planejamento', etapas: '8/8' },
          { code: 'SPEC-038', title: 'Tela Sobre', etapas: '12/12' },
          { code: 'SPEC-037', title: 'Planejar', etapas: '13/13' },
          { code: 'SPEC-036', title: 'Pasta e palco no Canvas', etapas: '13/13' },
        ] },
      ],
    };
  }
}
</script>
</body>
</html>
