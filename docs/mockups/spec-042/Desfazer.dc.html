<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Aviso com Desfazer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: #E7E9EE">
  <dc-import name="Main" prog="5 de 7" aviso="{{nao}}" movida="{{sim}}" hint-size="1440px,900px"></dc-import>
  <div role="status" style="position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); margin-left: 28px; height: 48px; box-sizing: border-box; padding: 0 8px 0 16px; background: #1A1E26; border: 1px solid #3A4250; border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 20px; font-size: 14px">
    <span>SPEC-043 foi para a Sprint 4</span>
    <button style="height: 32px; padding: 0 10px; background: transparent; border: 0; border-radius: 5px; color: #F2A541; font: 600 13px 'IBM Plex Sans', sans-serif">Desfazer</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { nao: false, sim: true }; }
}
</script>
</body>
</html>
