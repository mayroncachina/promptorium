<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Cabeçalho da spec</title><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="box-sizing: border-box; height: 96px; padding: 16px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #252B35; font-family: 'IBM Plex Sans', sans-serif; color: #E7E9EE">
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
    <span style="font: 13px 'JetBrains Mono', monospace; color: #A0A8B6">SPEC-042 · spec/042-sprints → main</span>
    <div style="display: flex; align-items: center; gap: 12px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600">Sprints no Quadro</h1>
      <span style="height: 28px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 7px; border: 1px solid {{cor}}; border-radius: 14px; background: {{fundo}}; color: {{cor}}; font-size: 13px; font-weight: 500">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="{{cor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{icone}}"></path></svg>
        <span>{{estado}}</span>
      </span>
    </div>
  </div>
  <button disabled="{{bloqueado}}" style="height: 40px; padding: 0 18px; border: 0; border-radius: 8px; background: {{fundoBotao}}; color: {{corBotao}}; font: 600 14px 'IBM Plex Sans', sans-serif">{{acao}}</button>
  <button aria-label="Mais ações" style="width: 40px; height: 40px; border: 1px solid #252B35; border-radius: 8px; background: #14171D; color: #A0A8B6; font-size: 18px">⋯</button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1044,"height":96},"tipo":{"type":"string","default":"conferindo"}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      conferindo: ['Conferindo a resolução', '#8EC5FF', 'M1.5 7 A5.5 5.5 0 0 1 12.5 7 M7 7 L10 4.5', 'Mergear na main', true],
      reprovada: ['Resolução reprovada no gate', '#F27A6E', 'M2 2 H12 V12 H2 Z M4.8 4.8 L9.2 9.2 M9.2 4.8 L4.8 9.2', 'Corrigir e verificar', false],
      aprovada: ['Conflito resolvido · gate aprovado', '#5BC88A', 'M2.5 7.5 L5.5 10.5 L11.5 3.5', 'Mergear na main', false],
      desatualizada: ['A base mudou · resolver de novo', '#F2A541', 'M11.5 5 A5 5 0 0 0 2.5 5 M2.5 2 V5 H5.5 M2.5 9 A5 5 0 0 0 11.5 9 M11.5 12 V9 H8.5', 'Resolver de novo', false],
    }[this.props.tipo];
    const [estado, cor, icone, acao, bloqueado] = T;
    const hex = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
    return { estado, cor, icone, acao, bloqueado, fundo: hex(cor, .1), fundoBotao: bloqueado ? '#2A2E36' : '#F2A541', corBotao: bloqueado ? '#7C8595' : '#1A1206' };
  }
}
</script>
</body>
</html>
