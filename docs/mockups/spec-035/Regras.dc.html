<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Configurações: regras do Orquestrador</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1014}
html,body{overflow-x:clip}
button{font-family:inherit;transition:background-color .12s ease-out,filter .12s ease-out}
button:hover{filter:brightness(1.12)}
button:active{filter:brightness(.88)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #F2A541;outline-offset:2px}
b,strong{font-weight:600}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.board{background-color:#0E1014;background-image:radial-gradient(#232833 1.2px,transparent 1.3px);background-size:24px 24px}
.scrim{position:absolute;inset:0;background:rgba(6,8,11,.62);z-index:5}
.modal{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:min(780px,calc(100% - 24px));max-height:calc(100% - 24px);background:#14171D;border:1px solid #2E3542;border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden}
.sel{height:32px;background:#0E1014;color:#E7E9EE;border:1px solid #2E3542;border-radius:6px;padding:0 8px;font-family:inherit;font-size:13px}
.btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid #2E3542;background:transparent;color:#E7E9EE;font-size:13px;cursor:pointer;white-space:nowrap}
.btn.pri{background:#F2A541;border-color:#F2A541;color:#14171D;font-weight:600}
.seg{height:30px;padding:0 12px;border:none;border-radius:6px;background:transparent;color:#A0A8B6;font-size:13px;cursor:pointer;white-space:nowrap}
.seg.on{background:#1F2430;color:#E7E9EE}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
.sk{display:block;border-radius:4px;background:#2E3542;animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
@keyframes ev-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ev{animation:ev-in .16s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){.sk,.ev{animation:none}button{transition:none}}
@media (max-width: 640px){nav button,main button{min-height:44px;min-width:44px}.chip,.hide-s{display:none !important}.row2{flex-direction:column;align-items:stretch !important}}
</style>
</helmet>
<div style="width: 100%; min-height: 700px; height: 700px; position: relative; overflow: hidden; display: flex; background: #0E1014; color: #E7E9EE; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; line-height: 1.45">
<nav aria-label="Seções" style="width: 52px; flex: none; background: #14171D; border-right: 1px solid #252B35; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 12px"><button type="button" aria-label="Prompt" aria-current="false" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: none; cursor: pointer; background: transparent; color: #A0A8B6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></svg></button><button type="button" aria-label="Quadro" aria-current="false" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: none; cursor: pointer; background: transparent; color: #A0A8B6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="11" rx="1.5"/></svg></button><button type="button" aria-label="Specs" aria-current="false" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: none; cursor: pointer; background: transparent; color: #A0A8B6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg></button><button type="button" aria-label="Review" aria-current="false" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: none; cursor: pointer; background: transparent; color: #A0A8B6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button></nav>
<main aria-label="Configurações" style="flex: 1; min-width: 0; display: flex; overflow: hidden">
<div class="hide-s" style="width: 200px; flex: none; padding: 16px 10px; border-right: 1px solid #252B35; display: flex; flex-direction: column; gap: 2px"><div style="font-weight: 600; font-size: 14px; padding: 0 10px 10px">Configurações</div><button type="button" style="height: 32px; padding: 0 10px; text-align: left; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; background: transparent; color: #A0A8B6">Modelo e consumo</button><button type="button" aria-current="page" style="height: 32px; padding: 0 10px; text-align: left; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; background: #2A2418; color: #F2A541">Orquestrador</button><button type="button" style="height: 32px; padding: 0 10px; text-align: left; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; background: transparent; color: #A0A8B6">Execução de specs</button><button type="button" style="height: 32px; padding: 0 10px; text-align: left; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; background: transparent; color: #A0A8B6">Sessões</button><button type="button" style="height: 32px; padding: 0 10px; text-align: left; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; background: transparent; color: #A0A8B6">Automações (hooks)</button><button type="button" style="height: 32px; padding: 0 10px; text-align: left; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; background: transparent; color: #A0A8B6">Provedores (ACP)</button><button type="button" style="height: 32px; padding: 0 10px; text-align: left; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; background: transparent; color: #A0A8B6">Banco e backups</button></div>
<div style="flex: 1; min-width: 0; padding: 18px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
<div><h1 style="margin: 0; font-size: 16px; font-weight: 600">Orquestrador</h1><div style="font-size: 12px; color: #A0A8B6">Escolhe o modelo de cada etapa. Você pode trocar qualquer escolha antes de executar.</div></div>
<button type="button" class="btn">Restaurar padrão</button>
</div>
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked="{{autoDefault}}" onChange="{{toggleDefault}}" style="width: 16px; height: 16px; accent-color: #F2A541"></input>Abrir Executar em Automático</label>
<div style="background: #14171D; border: 1px solid #252B35; border-radius: 10px; overflow-x: auto">
<div style="min-width: 560px">
<div style="display: grid; grid-template-columns: 150px minmax(0, 1fr) 120px 110px; gap: 12px; padding: 8px 14px; font-size: 12px; color: #A0A8B6; border-bottom: 1px solid #252B35"><span>Tipo de etapa</span><span>Quando se aplica</span><span>Modelo</span><span>Esforço</span></div>
<sc-for list="{{rules}}" as="r" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 150px minmax(0, 1fr) 120px 110px; gap: 12px; padding: 7px 14px; align-items: center; border-bottom: 1px solid #1F2430">
<span style="font-weight: 500">{{r.name}}</span><span style="font-size: 12px; color: #A0A8B6">{{r.when}}</span>
<label><span class="vh">Modelo de {{r.name}}</span><select class="sel" style="width: 100%" value="{{r.model}}" onChange="{{r.change}}"><option value="Haiku">Haiku</option><option value="Sonnet">Sonnet</option><option value="Opus">Opus</option><option value="Codex">Codex</option></select></label>
<label><span class="vh">Esforço de {{r.name}}</span><select class="sel" style="width: 100%" value="{{r.effort}}" onChange="{{r.changeE}}"><option value="low">low</option><option value="medium">medium</option><option value="high">high</option></select></label>
</div>
</sc-for>
</div>
</div>
<div class="row2" style="display: flex; gap: 12px; align-items: stretch">
<div style="flex: 1; min-width: 0; padding: 12px 14px; background: #14171D; border: 1px solid #252B35; border-radius: 10px; display: flex; flex-direction: column; gap: 8px">
<div style="font-weight: 600">Se a verificação reprovar</div>
<div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><span>Haiku</span><span aria-hidden="true" style="color: #A0A8B6">→</span><span>Sonnet</span><span aria-hidden="true" style="color: #A0A8B6">→</span><span>Opus</span><span aria-hidden="true" style="color: #A0A8B6">→</span><span style="color: #F2A541">aguardando você</span></div>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: #A0A8B6">Escaladas por etapa<select class="sel" style="width: 72px"><option>2</option><option>1</option><option>0</option></select></label>
</div>
<div style="flex: 1; min-width: 0; padding: 12px 14px; background: #14171D; border: 1px solid #252B35; border-radius: 10px; display: flex; flex-direction: column; gap: 8px">
<div style="font-weight: 600">Limites</div>
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked="{{askOpus}}" onChange="{{toggleOpus}}" style="width: 16px; height: 16px; accent-color: #F2A541"></input>Perguntar antes de escalar para Opus</label>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: #A0A8B6">Classificar as etapas com<select class="sel" style="width: 110px"><option>Haiku</option><option>Sonnet</option></select></label>
</div>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":700}}'>
class Component extends DCLogic {

renderVals() {

const base = [
  {name:'Mecânica', when:'Renomear, mover, ajustar valores, sem lógica nova', model:'Haiku', effort:'low'},
  {name:'Implementação', when:'Tela, serviço ou regra nova, com testes', model:'Sonnet', effort:'medium'},
  {name:'Alto risco', when:'Migração, concorrência, segurança, arquitetura', model:'Opus', effort:'high'},
  {name:'Documentação', when:'Só texto: ajuda, README, changelog', model:'Haiku', effort:'low'},
  {name:'Revisão', when:'Etapas REV: o provedor é outro, se houver', model:'Codex', effort:'medium'},
];
const over = this.state?.over ?? {};
const rules = base.map((r) => ({
  ...r, ...(over[r.name] ?? {}),
  change: (e) => this.setState({ over: { ...over, [r.name]: { ...(over[r.name] ?? {}), model: e.target.value } } }),
  changeE: (e) => this.setState({ over: { ...over, [r.name]: { ...(over[r.name] ?? {}), effort: e.target.value } } }),
}));
const autoDefault = this.state?.autoDefault ?? false;
const askOpus = this.state?.askOpus ?? false;
return {
  rules, autoDefault, askOpus,
  toggleDefault: () => this.setState({ autoDefault: !autoDefault }),
  toggleOpus: () => this.setState({ askOpus: !askOpus }),
};

}
}
</script>
</body>
</html>
