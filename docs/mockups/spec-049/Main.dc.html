<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Quadro em vidro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05070A}
.glass{background:rgba(22,27,36,.52);border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 50px rgba(0,0,0,.35);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%)}
.glass2{background:rgba(30,36,48,.55);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ghost{background:transparent;border:1px solid rgba(255,255,255,.08)}
button{font-family:'IBM Plex Sans',sans-serif;cursor:pointer}
a{color:#F2A541}a:hover{color:#FFC46B}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; color: #E7E9EE; font-family: 'IBM Plex Sans', sans-serif; background: radial-gradient(900px 600px at 12% -8%, rgba(242,165,65,{{brilho}}), transparent 60%), radial-gradient(900px 700px at 100% 108%, rgba(79,209,181,{{brilho}}), transparent 60%), #05070A">
  <div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size: 28px 28px"></div>

  <nav aria-label="Seções" class="glass" style="position: absolute; left: 16px; top: 16px; bottom: 16px; width: 64px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; box-sizing: border-box">
    <div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 11px; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, rgba(242,165,65,.25), rgba(79,209,181,.25)); border: 1px solid rgba(255,255,255,.12)">
      <svg width="18" height="20" viewBox="0 0 18 20" fill="none" stroke="#F2A541" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1v6L1.6 16.2C1 17.3 1.8 19 3 19h12c1.2 0 2-1.7 1.4-2.8L11 7V1M5.5 1h7"></path></svg>
    </div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
      <button aria-label="{{n.label}}" style="position: relative; width: 44px; height: 44px; border-radius: 12px; border: 1px solid {{n.borda}}; background: {{n.bg}}; display: flex; align-items: center; justify-content: center; box-shadow: {{n.glow}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="{{n.cor}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>
      </button>
    </sc-for>
    <div style="flex: 1"></div>
    <button aria-label="Configurações" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#A0A8B6" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3"></circle><path d="M10 1.5v2.2M10 16.3v2.2M1.5 10h2.2M16.3 10h2.2M4 4l1.6 1.6M14.4 14.4 16 16M4 16l1.6-1.6M14.4 5.6 16 4"></path></svg>
    </button>
  </nav>

  <header class="glass" style="position: absolute; left: 96px; right: 16px; top: 16px; height: 56px; border-radius: 16px; display: flex; align-items: center; gap: 16px; padding: 0 12px 0 20px; box-sizing: border-box">
    <span style="font-size: 14px; color: #A0A8B6">promptorium <span style="color: #5C6575">/</span> <span style="color: #E7E9EE; font-weight: 500">Quadro</span></span>
    <div style="flex: 1; display: flex; justify-content: center">
      <button class="glass2" style="width: 440px; height: 36px; border-radius: 10px; display: flex; align-items: center; gap: 10px; padding: 0 12px; color: #A0A8B6; font-size: 14px">
        <svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#A0A8B6" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="5"></circle><path d="m11 11 3.5 3.5"></path></svg>
        <span style="flex: 1; text-align: left">Buscar spec, sessão ou comando</span>
        <span style="font: 500 12px 'JetBrains Mono', monospace; padding: 2px 7px; border-radius: 6px; border: 1px solid rgba(255,255,255,.1); color: #A0A8B6">Ctrl K</span>
      </button>
    </div>
    <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #C9CED8"><span style="width: 8px; height: 8px; border-radius: 4px; background: #4FD1B5; box-shadow: 0 0 10px #4FD1B5"></span>1 rodando</span>
    <span style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 16px; font-size: 13px; color: #F2A541; background: rgba(242,165,65,.1); border: 1px solid rgba(242,165,65,.35); box-shadow: 0 0 18px rgba(242,165,65,.18)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F2A541"></span>1 precisa de você</span>
  </header>

  <main style="position: absolute; left: 96px; right: 16px; top: 88px; bottom: 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 14px; padding: 6px 4px 0">
      <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.01em">Quadro</h1>
      <button class="glass2" style="height: 36px; border-radius: 10px; display: flex; align-items: center; gap: 10px; padding: 0 12px; color: #E7E9EE; font-size: 14px; font-weight: 500">Sprint 3 <span style="color: #A0A8B6; font-weight: 400">6 de 7</span>
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#A0A8B6" stroke-width="1.6" stroke-linecap="round"><path d="m3 4.5 3 3 3-3"></path></svg>
      </button>
      <div style="flex: 1"></div>
      <div role="group" aria-label="Visão" class="glass2" style="display: flex; padding: 3px; border-radius: 11px; gap: 2px">
        <button aria-pressed="true" style="height: 30px; padding: 0 14px; border: 0; border-radius: 8px; background: rgba(255,255,255,.1); color: #E7E9EE; font-size: 13px; font-weight: 500">Colunas</button>
        <button aria-pressed="false" style="height: 30px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: #A0A8B6; font-size: 13px">Grafo</button>
        <button aria-pressed="false" style="height: 30px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: #A0A8B6; font-size: 13px">Foco</button>
      </div>
      <button style="height: 36px; padding: 0 16px; border: 0; border-radius: 10px; background: #F2A541; color: #1A1206; font-size: 14px; font-weight: 600; box-shadow: 0 0 24px rgba(242,165,65,.35)">Nova spec</button>
    </div>

    <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{colunas}}" as="col" hint-placeholder-count="4">
        <section class="glass" style="border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0">
          <div style="display: flex; align-items: center; gap: 8px; padding: 2px 4px 6px">
            <span style="width: 6px; height: 6px; border-radius: 3px; background: {{col.cor}}; box-shadow: 0 0 8px {{col.cor}}"></span>
            <h2 style="margin: 0; flex: 1; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #A0A8B6">{{col.nome}}</h2>
            <span style="font: 500 12px 'JetBrains Mono', monospace; color: #8A93A3">{{col.n}}</span>
          </div>
          <sc-for list="{{col.cards}}" as="c" hint-placeholder-count="2">
            <article class="glass2" style="border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border-color: {{c.borda}}; box-shadow: {{c.glow}}">
              <div style="display: flex; align-items: center; gap: 8px">
                <span style="font: 500 12px 'JetBrains Mono', monospace; color: #A0A8B6">{{c.code}}</span>
                <div style="flex: 1"></div>
                <span style="font-size: 12px; font-weight: 500; color: {{c.etapaCor}}">{{c.etapa}}</span>
              </div>
              <span style="font-size: 15px; font-weight: 500; line-height: 21px">{{c.titulo}}</span>
              <div style="display: flex; align-items: center; gap: 6px">
                <sc-for list="{{c.dots}}" as="d" hint-placeholder-count="4">
                  <span style="width: 22px; height: 4px; border-radius: 2px; background: {{d.c}}; box-shadow: {{d.g}}"></span>
                </sc-for>
                <div style="flex: 1"></div>
                <span style="font: 500 12px 'JetBrains Mono', monospace; color: #8A93A3">{{c.conta}}</span>
              </div>
            </article>
          </sc-for>
        </section>
      </sc-for>
    </div>
  </main>

  <div class="glass" style="position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); height: 52px; border-radius: 26px; display: flex; align-items: center; gap: 14px; padding: 0 8px 0 18px; border-color: rgba(79,209,181,.25); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 0 40px rgba(79,209,181,.14), 0 20px 50px rgba(0,0,0,.45)">
    <span aria-hidden="true" style="display: flex; align-items: center; gap: 3px; height: 20px">
      <span style="width: 3px; height: 8px; border-radius: 2px; background: #4FD1B5"></span><span style="width: 3px; height: 16px; border-radius: 2px; background: #4FD1B5"></span><span style="width: 3px; height: 11px; border-radius: 2px; background: #4FD1B5"></span><span style="width: 3px; height: 18px; border-radius: 2px; background: #4FD1B5"></span><span style="width: 3px; height: 9px; border-radius: 2px; background: #4FD1B5"></span>
    </span>
    <span style="font: 500 13px 'JetBrains Mono', monospace; color: #E7E9EE">SPEC-040 · R4</span>
    <span style="font-size: 13px; color: #A0A8B6">sonnet · transcrevendo no computador</span>
    <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.06); color: #E7E9EE; font-size: 13px; font-weight: 500">Abrir sessão</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900},"brilho":{"editor":"range","default":0.12,"min":0,"max":0.3,"step":0.01,"section":"Vidro"}}'>
class Component extends DCLogic {
  renderVals() {
    const A = '#F2A541', T = '#4FD1B5', G = '#5BC88A', M = 'rgba(255,255,255,.12)';
    const icons = [
      ['Início', 'M3 9.5 10 3l7 6.5V17H3z'],
      ['Quadro', 'M3 3h5v14H3zM12 3h5v8h-5z'],
      ['Sessões', 'M3 4h14v10H3zM7 17h6'],
      ['Review', 'M4 10l4 4 8-9'],
      ['Repositório', 'M6 3v14M6 7c6 0 8 2 8 6M14 13a2 2 0 1 0 0 .1M6 3a1 1 0 1 0 0 .1'],
      ['Código', 'M7 6 3 10l4 4M13 6l4 4-4 4'],
      ['Prompts', 'M4 4h12v9H8l-4 3z'],
    ];
    const nav = icons.map(([label, d], i) => {
      const on = i === 1;
      return { label, d, cor: on ? A : '#A0A8B6', bg: on ? 'rgba(242,165,65,.12)' : 'transparent', borda: on ? 'rgba(242,165,65,.4)' : 'transparent', glow: on ? '0 0 18px rgba(242,165,65,.25)' : 'none' };
    });
    const dots = (done, total, live) => Array.from({ length: total }, (_, i) => ({ c: i < done ? G : i === done && live ? A : M, g: i === done && live ? '0 0 8px ' + A : 'none' }));
    const card = (code, titulo, etapa, etapaCor, done, total, extra = {}) => ({ code, titulo, etapa, etapaCor, dots: dots(done, total, extra.live), conta: total ? done + '/' + total : 'sem etapas', borda: extra.borda ?? 'rgba(255,255,255,.08)', glow: extra.glow ?? 'inset 0 1px 0 rgba(255,255,255,.07)' });
    const colunas = [
      { nome: 'Backlog', cor: '#8A93A3', n: '1', cards: [card('SPEC-049', '[Próxima spec]', 'rascunho', '#A0A8B6', 0, 0)] },
      { nome: 'Em execução', cor: A, n: '1', cards: [card('SPEC-040', 'Ditado por voz', 'R4 · executando', A, 3, 10, { live: true, borda: 'rgba(242,165,65,.45)', glow: 'inset 0 1px 0 rgba(255,255,255,.07), 0 0 28px rgba(242,165,65,.16)' })] },
      { nome: 'Review', cor: '#8EC5FF', n: '1', cards: [card('SPEC-043', 'Conflito conferido pelo gate', 'precisa de você', A, 9, 9, { borda: 'rgba(142,197,255,.3)' })] },
      { nome: 'Feito', cor: G, n: '4', cards: [card('SPEC-048', 'Marcar commits de agente', 'feito', G, 8, 8), card('SPEC-047', 'Higiene do repositório', 'feito', G, 8, 8), card('SPEC-046', 'Atividade do repositório', 'feito', G, 8, 8), card('SPEC-045', 'Grafo do repositório', 'feito', G, 9, 9)] },
    ];
    return { nav, colunas, brilho: this.props.brilho ?? 0.12 };
  }
}
</script>
</body>
</html>
