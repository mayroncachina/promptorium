<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Troca de seção e indicador da barra lateral</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1014}
html,body{overflow-x:clip}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid #F2A541;outline-offset:2px}
b,strong{font-weight:600}
.mono{font-family:'JetBrains Mono',monospace}
.m-hoje{--k:0}.m-prop{--k:1}.m-lento{--k:4}
.app{--q:calc(120ms*var(--k));--qx:calc(80ms*var(--k));--b:calc(160ms*var(--k));--bx:calc(110ms*var(--k));--e:calc(220ms*var(--k));--ex:calc(150ms*var(--k));--s:calc(640ms*var(--k));--in:cubic-bezier(.2,.8,.2,1);--out:cubic-bezier(.4,0,1,1)}
@media (prefers-reduced-motion:reduce){.app{--k:0 !important}}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:2px;border:1px solid #252B35;border-radius:8px;background:#14171D}
.seg button{white-space:nowrap;height:30px;padding:0 12px;border-radius:6px;font-size:12px;color:#A0A8B6}
.seg button:hover{color:#E7E9EE}
.seg button.on{background:#2A2418;color:#F2A541;font-weight:600}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid #252B35;border-radius:6px;background:#14171D;font-size:13px;color:#E7E9EE;transition:background-color var(--q) var(--in),border-color var(--q) var(--in),transform var(--q) var(--in)}
.btn:hover{background:#1A1E26;border-color:#3A4250}
.btn:active{transform:scale(.98)}
.m-hoje .btn:active{transform:none}
.btn.pri{background:#F2A541;border-color:#F2A541;color:#1A1206;font-weight:600}
.btn.pri:hover{background:#F6B662;border-color:#F6B662}
.btn.danger{background:#F27A6E;border-color:#F27A6E;color:#1A1206;font-weight:600}
.btn.danger:hover{background:#F58F85;border-color:#F58F85}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kbd{font-family:'JetBrains Mono',monospace;font-size:11px;padding:1px 4px;border:1px solid #252B35;border-radius:4px;background:#0E1014;color:#A0A8B6}
.side a,.nav{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;color:#A0A8B6}
.nav.on{color:#F2A541}

.ind{position:absolute;left:8px;top:10px;width:40px;height:40px;border-radius:8px;background:#2A2418;transition:transform var(--s) var(--in)}
.nav{transition:color var(--q) var(--in)}
.nav:hover{color:#E7E9EE}
.nav.on:hover{color:#F2A541}
@keyframes dnA{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes dnB{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes upA{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes upB{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.dnA{animation:dnA var(--s) var(--in) both}.dnB{animation:dnB var(--s) var(--in) both}
.upA{animation:upA var(--s) var(--in) both}.upB{animation:upB var(--s) var(--in) both}
.line{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #252B35}
</style>
</helmet>
<div class="app {{cls}}" style="min-height:100vh;display:flex;background:#0E1014;color:#E7E9EE;font-family:'IBM Plex Sans',sans-serif;font-size:14px">

<nav aria-label="Navegação" style="position:relative;flex:none;width:56px;padding:10px 8px;display:flex;flex-direction:column;gap:4px;border-right:1px solid #252B35;background:#14171D">
<span class="ind" style="transform:translateY({{y}}px)"></span>
<button class="nav {{on0}}" aria-label="Início" aria-current="{{cur0}}" onClick="{{go0}}" style="position:relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></button><button class="nav {{on1}}" aria-label="Projeto" aria-current="{{cur1}}" onClick="{{go1}}" style="position:relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h6l2 2h10v11H3z"></path></svg></button><button class="nav {{on2}}" aria-label="Specs" aria-current="{{cur2}}" onClick="{{go2}}" style="position:relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 12h7M9 16h7"></path></svg></button><button class="nav {{on3}}" aria-label="Quadro" aria-current="{{cur3}}" onClick="{{go3}}" style="position:relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v16H4zM14 4h6v10h-6z"></path></svg></button><button class="nav {{on4}}" aria-label="Sessões" aria-current="{{cur4}}" onClick="{{go4}}" style="position:relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l6 6-6 6"></path><path d="M12 19h8"></path></svg></button><button class="nav {{on5}}" aria-label="Review" aria-current="{{cur5}}" onClick="{{go5}}" style="position:relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="6" r="2.5"></circle><circle cx="7" cy="18" r="2.5"></circle><circle cx="17" cy="9" r="2.5"></circle><path d="M7 8.5v7M17 11.5c0 3-5 3-8 4"></path></svg></button><button class="nav {{on6}}" aria-label="Código" aria-current="{{cur6}}" onClick="{{go6}}" style="position:relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"></path></svg></button><button class="nav {{on7}}" aria-label="Prompt" aria-current="{{cur7}}" onClick="{{go7}}" style="position:relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></button><button class="nav {{on8}}" aria-label="Ferramentas" aria-current="{{cur8}}" onClick="{{go8}}" style="position:relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6a4 4 0 0 0 5 5l-9 9-4-4 9-9z"></path></svg></button>
</nav>
<main style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
<header style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #252B35">
<div style="flex:1 1 320px;min-width:0"><h1 style="margin:0;font-size:16px;font-weight:600">Troca de seção</h1><p style="margin:2px 0 0;font-size:12px;color:#A0A8B6">Clique na barra lateral: a tela nova entra na direção do movimento, e o destaque desliza até o item.</p></div>
<div class="seg" role="group" aria-label="Movimento">
<button class="{{m.hoje}}" aria-pressed="{{m.isHoje}}" onClick="{{m.setHoje}}">Hoje</button>
<button class="{{m.prop}}" aria-pressed="{{m.isProp}}" onClick="{{m.setProp}}">Proposta</button>
<button class="{{m.lento}}" aria-pressed="{{m.isLento}}" onClick="{{m.setLento}}">4× mais lento</button>
</div>
</header>
<section class="{{enter}}" style="flex:1;padding:20px;max-width:760px">
<h2 style="margin:0 0 14px;font-size:20px;font-weight:600">{{title}}</h2>
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3"><div class="line"><span>{{r.a}}</span><span style="color:#A0A8B6;font-size:13px">{{r.b}}</span></div></sc-for>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":700}}'>
class Component extends DCLogic {
constructor(p){super(p);this.state={mode:'prop',i:2,dir:'dn',n:0};}

K(){return ({hoje:0,prop:1,lento:4})[this.state.mode];}
modeVals(){const s=this.state.mode,set=(mode)=>()=>this.setState({mode});
return {cls:'m-'+s,m:{hoje:s==='hoje'?'on':'',prop:s==='prop'?'on':'',lento:s==='lento'?'on':'',isHoje:s==='hoje',isProp:s==='prop',isLento:s==='lento',setHoje:set('hoje'),setProp:set('prop'),setLento:set('lento')}};}


renderVals(){const S=[{"n": "Início", "t": "Para você", "rows": [{"a": "SPEC-033 · Etapa 3", "b": "aguardando você"}, {"a": "SPEC-032 · Review", "b": "pronta para merge"}, {"a": "SPEC-031 · Sessão", "b": "terminou há 4 min"}]}, {"n": "Projeto", "t": "Projeto", "rows": [{"a": "promptorium", "b": "branch main"}, {"a": "Testes", "b": "flutter test"}, {"a": "Memória do projeto", "b": "12 itens"}]}, {"n": "Specs", "t": "Specs", "rows": [{"a": "SPEC-033", "b": "Decidir a etapa pelo balão"}, {"a": "SPEC-032", "b": "Fila de review em pilha"}, {"a": "SPEC-031", "b": "Marca no cabeçalho"}]}, {"n": "Quadro", "t": "Quadro", "rows": [{"a": "Backlog", "b": "3 specs"}, {"a": "Em execução", "b": "1 spec"}, {"a": "Review", "b": "2 specs"}]}, {"n": "Sessões", "t": "Sessões", "rows": [{"a": "SPEC-033 · R3", "b": "aguardando você"}, {"a": "Refino da SPEC-032", "b": "encerrada"}, {"a": "Corrigir teste de IO", "b": "encerrada"}]}, {"n": "Review", "t": "Review", "rows": [{"a": "SPEC-032", "b": "6 arquivos, 2 comentários"}, {"a": "SPEC-030", "b": "3 arquivos"}, {"a": "SPEC-029", "b": "1 arquivo"}]}, {"n": "Código", "t": "Código", "rows": [{"a": "lib/app.dart", "b": "alterado"}, {"a": "lib/ui/theme/tokens.dart", "b": ""}, {"a": "lib/ui/shell/app_shell.dart", "b": ""}]}, {"n": "Prompt", "t": "Prompt", "rows": [{"a": "Nova conversa", "b": "Ctrl+N"}, {"a": "Refinar SPEC-033", "b": "ontem"}, {"a": "Dúvida sobre o gate", "b": "ontem"}]}, {"n": "Ferramentas", "t": "Ferramentas", "rows": [{"a": "Agentes", "b": "4"}, {"a": "Skills", "b": "9"}, {"a": "Servidores MCP", "b": "3"}]}];const i=this.state.i,o={};
S.forEach((s,j)=>{o['on'+j]=j===i?'on':'';o['cur'+j]=j===i?'page':'false';o['go'+j]=()=>{if(j===i)return;this.setState({i:j,dir:j>i?'dn':'up',n:this.state.n+1});};});
return {...this.modeVals(),...o,y:i*44,title:S[i].t,rows:S[i].rows,enter:this.state.dir+(this.state.n%2?'A':'B')};}

}
</script>
</body>
</html>
