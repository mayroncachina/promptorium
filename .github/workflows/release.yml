name: Release

# Criar uma release no GitHub (Releases → Draft a new release, com tag nova
# vX.Y.Z) compila, testa, empacota (.deb + .tar.gz no Linux, .zip no Windows)
# e anexa os arquivos a ela.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    # 22.04: o binário depende da glibc do runner; compilar no mais antigo
    # suportado deixa o .deb instalável em 22.04 ou mais novo.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versão a partir da tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+~-][0-9A-Za-z.+~-]*)?$ ]]; then
            echo "Tag '$tag' inválida: use vX.Y.Z (ex.: v0.1.0)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-deb
        with:
          version: ${{ steps.version.outputs.version }}

      # As notas da release saem sempre do git-cliff (commits convencionais
      # desde a tag anterior), no lugar do texto automático do GitHub.
      - name: Notas da release (git-cliff)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo npm install -g git-cliff >/dev/null
          git cliff --latest --strip header -o notes.md
          printf '\n**Changelog completo**: %s/%s/compare/%s...%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
            "$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo "$GITHUB_REF_NAME")" \
            "$GITHUB_REF_NAME" >> notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Versão a partir da tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)([.+~-][0-9A-Za-z.+~-]*)?$ ]]; then
            echo "Tag '$tag' inválida: use vX.Y.Z (ex.: v0.1.0)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-windows
        with:
          version: ${{ steps.version.outputs.version }}
          build-name: ${{ steps.version.outputs.base }}
          build-number: ${{ github.run_number }}

      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
