name: Release

# Compila, testa, empacota (.deb + .tar.gz no Linux, .zip no Windows) e
# anexa os arquivos à release da tag vX.Y.Z. É chamado pelo Criar Release
# (create-release.yml) e também roda ao publicar uma release à mão
# (Releases → Draft a new release).
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Tag da release (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  package:
    # 22.04: o binário depende da glibc do runner; compilar no mais antigo
    # suportado deixa o .deb instalável em 22.04 ou mais novo.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Versão a partir da tag
        id: version
        run: |
          tag="${TAG}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+~-][0-9A-Za-z.+~-]*)?$ ]]; then
            echo "Tag '$tag' inválida: use vX.Y.Z (ex.: v0.1.0)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A tag precisa estar num commit com a mesma versão no pubspec.yaml
      # (o commit do "Criar Release"), senão o repositório fica para trás.
      - name: Versão do pubspec.yaml confere com a tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pubspec="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#+]+).*/\1/p' pubspec.yaml)"
          if [ "$pubspec" != "$VERSION" ]; then
            echo "O pubspec.yaml está na versão '$pubspec', mas a tag é v$VERSION." >&2
            echo "Rode Actions → Criar Release, que cria a tag no commit da versão." >&2
            exit 1
          fi

      - uses: ./.github/actions/build-deb
        with:
          version: ${{ steps.version.outputs.version }}

      # As notas da release saem sempre do git-cliff (commits convencionais
      # desde a tag anterior), no lugar do texto automático do GitHub.
      - name: Notas da release (git-cliff)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo npm install -g git-cliff >/dev/null
          git cliff --latest --strip header -o notes.md
          printf '\n**Changelog completo**: %s/%s/compare/%s...%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
            "$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "$TAG")" \
            "$TAG" >> notes.md
          gh release edit "$TAG" --notes-file notes.md

      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Versão a partir da tag
        id: version
        run: |
          tag="${TAG}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)([.+~-][0-9A-Za-z.+~-]*)?$ ]]; then
            echo "Tag '$tag' inválida: use vX.Y.Z (ex.: v0.1.0)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-windows
        with:
          version: ${{ steps.version.outputs.version }}
          build-name: ${{ steps.version.outputs.base }}
          build-number: ${{ github.run_number }}

      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip --clobber
