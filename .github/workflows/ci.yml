name: CI

# Em todo PR: só analisa e testa. Ao mergear na main (push): também compila e
# gera o .deb, que fica como artefato da execução (aba Actions → a execução →
# Artifacts) por 14 dias, para testar antes de publicar uma release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Versão de desenvolvimento
        id: version
        if: github.event_name == 'push'
        run: |
          base="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          echo "version=${base}~ci.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-deb
        with:
          version: ${{ steps.version.outputs.version || '0.0.0' }}
          build: ${{ github.event_name == 'push' }}

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: promptorium-${{ steps.version.outputs.version }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error
