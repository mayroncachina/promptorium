name: CI

# Em todo PR e ao mergear na main (push): só analisa e testa. O .deb é gerado
# apenas ao publicar uma release (release.yml).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-deb
        with:
          version: 0.0.0
          build: false
