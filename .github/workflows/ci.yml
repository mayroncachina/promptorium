name: CI

# A cada push na main e em todo PR: analisa, testa, compila e gera o .deb.
# O .deb fica como artefato da execução (aba Actions → a execução → Artifacts)
# por 14 dias, para testar antes de publicar uma release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Versão de desenvolvimento
        id: version
        run: |
          base="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          echo "version=${base}~ci.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-deb
        with:
          version: ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: promptorium-${{ steps.version.outputs.version }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error
