name: CI

# Só em PRs: analisa e testa. O merge na main não roda nada (o PR já foi
# testado). O .deb é gerado apenas ao criar uma release (release.yml).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-deb
        with:
          version: 0.0.0
          build: false
