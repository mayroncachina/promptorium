name: Windows

# Manual (Actions → Windows → Run workflow): compila o Windows release da
# branch escolhida em "Use workflow from" (ou do ref informado) e deixa um
# .zip como artefato da execução por 14 dias, para testar antes de publicar
# uma release (a release gera e anexa o .zip sozinha).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag ou commit (vazio = a branch escolhida acima)"
        required: false
        default: ""
      flutter-version:
        description: Tag do Flutter
        required: false
        default: "3.47.7"

permissions:
  contents: read

concurrency:
  group: windows-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Versão
        id: version
        run: |
          base="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          sha="$(git rev-parse --short=7 HEAD)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "version=${base}-ci.${sha}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-windows
        with:
          version: ${{ steps.version.outputs.version }}
          build-name: ${{ steps.version.outputs.base }}
          build-number: ${{ github.run_number }}
          flutter-version: ${{ inputs.flutter-version }}

      - uses: actions/upload-artifact@v4
        with:
          name: promptorium-${{ steps.version.outputs.version }}-windows-x64
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error
